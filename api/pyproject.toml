[project]
name = "screening-api"
version = "0.0.0"
description = "AI-assisted candidate screening API"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "pymupdf>=1.25",
    # Required by FastAPI to parse multipart form uploads.
    "python-multipart>=0.0.20",
    # Argon2id password hashing. Chosen over bcrypt: memory-hard, so a leaked
    # hash costs an attacker RAM per guess, not just cycles.
    "argon2-cffi>=23.1",
    "openai>=1.59",
    # Observability. Traces are created always and exported only when an OTLP
    # endpoint is configured, so an unconfigured deployment pays almost nothing
    # and the $10/month footprint is unchanged.
    "opentelemetry-sdk>=1.44",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    "prometheus-client>=0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest-cov>=6.0",
    # Property-based tests: the generator finds the inputs nobody thinks of.
    "hypothesis>=6.140",
    # Mutation testing. Manual, not in CI: it is slow by nature.
    "mutmut>=3.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py314"
# A full copy of the tree, written by `mutmut run`. Linting it checks nothing
# and, being a duplicate, breaks module resolution.
extend-exclude = ["mutants"]

[tool.ruff.lint]
# S is bandit's rule set. It was available and switched off; enabling it found
# eight things, all of which turned out to be benign — which is the argument for
# having it on, since a real one had nowhere to hide.
select = ["E", "F", "I", "N", "UP", "B", "SIM", "S", "C90"]

[tool.ruff.lint.mccabe]
# Two functions were over this and were split rather than the gate being set to
# fit them. The number itself is arbitrary; holding it is not.
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerate emits long sa.Column(...) lines; the template cannot prevent it.
"alembic/versions/*" = ["E501"]
# Development tooling, deliberately excluded from the container. `assert` is
# right in a measurement script, and the URLs are constants written by us.
"scripts/*" = ["S101", "S310"]
# A test suite is made of asserts, and its passwords are fixtures. The migration
# test shells out to alembic against a scratch database it names itself.
"tests/*" = ["S101", "S105", "S106", "S603", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# SAWarnings almost always mean a real modelling mistake. Fail on them.
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# Branch coverage, which is stricter than line coverage and the reason this
# number is lower than the 96% a line-only report shows. A floor, not a target:
# set just under where the suite actually sits, so it catches a real drop rather
# than failing on a rounding change.
fail_under = 93
show_missing = true
skip_covered = true
exclude_also = [
    # Declared for type checkers; never executed.
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",
    # Guards the caller has already ruled out, marked at the site with a reason.
    "raise NotImplementedError",
]

[tool.coverage.paths]
source = ["app", "/app/app"]

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["^tests/", "^mutants/"]

# Test helpers are imported by scripts, so mypy follows them past the exclude.
[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

# Strict where correctness matters most: the AI boundary and the PDF pipeline.
[[tool.mypy.overrides]]
module = ["app.ai.*", "app.ingest.*"]
strict = true

[tool.mutmut]
# Mutation testing answers the question coverage cannot: do the tests *notice*
# when the code changes? A line can be covered by a test that would pass however
# the line behaved.
#
# Scoped to the pure logic where a surviving mutant is unambiguously a gap —
# verification, scoring, duplicate detection, throttling. Mutating an endpoint
# mostly produces mutants killed by a framework, which tells you nothing and
# costs the same to run. It is slow by nature and stays a manual tool:
#
#   .venv/bin/mutmut run
#   .venv/bin/mutmut results
#
source_paths = ["app"]
only_mutate = [
    "app/ai/verify.py",
    "app/services/duplicates.py",
    "app/services/compare.py",
    "app/services/limits.py",
    "app/services/screening.py",
]
# Only the tests that could plausibly kill these, so a run is minutes not hours.
pytest_add_cli_args_test_selection = [
    "tests/test_properties.py",
    "tests/test_evaluator.py",
    "tests/test_duplicates.py",
    "tests/test_compare.py",
    "tests/test_limits.py",
    "tests/test_screening.py",
]
also_copy = ["tests", "pyproject.toml", "alembic.ini", "alembic"]
