[project]
name = "screening-api"
version = "0.0.0"
description = "AI-assisted candidate screening API"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "pymupdf>=1.25",
    "openai>=1.59",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerate emits long sa.Column(...) lines; the template cannot prevent it.
"alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# SAWarnings almost always mean a real modelling mistake. Fail on them.
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["^tests/"]

# Strict where correctness matters most: the AI boundary and the PDF pipeline.
[[tool.mypy.overrides]]
module = ["app.ai.*", "app.ingest.*"]
strict = true
