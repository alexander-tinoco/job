services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: screening
      POSTGRES_PASSWORD: screening
      POSTGRES_DB: screening
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U screening -d screening"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Trace viewer, behind a profile so the ordinary stack stays three containers.
  #
  #   OTEL_ENDPOINT=http://jaeger:4318/v1/traces \
  #     docker compose --profile tracing up -d
  #
  # Then http://localhost:16686. Storage is in memory: restarting the container
  # discards every trace, which is what you want on a laptop and never in a
  # deployment.
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    profiles: ["tracing"]
    ports:
      - "16686:16686"   # the UI
      - "4318:4318"     # OTLP over HTTP, the endpoint the API exports to
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://screening:screening@db:5432/screening
      # Local compose serves plain http, so the Secure flag would stop the
      # cookie being stored. Never false in a deployment.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_JSON: ${LOG_JSON:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Off unless asked for: a loop that starts by accident spends real money.
      WORKER_ENABLED: ${WORKER_ENABLED:-false}
      UPLOADS_DIR: /srv/uploads
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/srv/uploads
    ports:
      - "8000:8000"
    healthcheck:
      # /ready, not /health: readiness is what says this instance can serve.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # The panel's URL segment. Choose your own per deployment and never link
        # to it publicly. Not a security control — the sign-in is.
        VITE_PANEL_PATH: ${VITE_PANEL_PATH:-panel}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  db_data:
  uploads:
