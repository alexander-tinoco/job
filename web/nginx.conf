server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Résumés are untrusted input and the panel renders their text, never their
    # markup. These headers are the backstop if that ever slips.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A résumé upload can be 10 MB; nginx defaults to 1 MB.
        client_max_body_size 12m;
        proxy_read_timeout 120s;
    }

    # The applicant's data endpoints. /apply/* is the page and falls through to
    # the SPA below; these two are the API calls that page makes.
    location ~ ^/openings/[^/]+/apply$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        client_max_body_size 12m;
        proxy_read_timeout 120s;
    }

    location ~ ^/openings/[^/]+$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
