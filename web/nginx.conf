server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Résumés are untrusted input and the panel renders their text, never their
    # markup. These headers are the backstop if that ever slips.
    #
    # The policy used to live in a <meta http-equiv> in index.html. A header is
    # strictly better: a meta tag cannot express frame-ancestors, base-uri or
    # form-action, and it does not cover responses that are not HTML. Declared
    # here only, so the two can never drift apart.
    #
    #   script-src 'self'   the bundle, and nothing from a CDN
    #   style-src  'unsafe-inline'  React sets style attributes; scripts do not
    #                               get the same latitude
    #   img-src    data:    the résumé pages are same-origin PNGs from the API
    #   connect-src 'self'  the panel talks to /api and nowhere else
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Ignored by browsers over plain http, so it is harmless in local compose and
    # right everywhere the panel is actually served.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A résumé upload can be 10 MB; nginx defaults to 1 MB.
        client_max_body_size 12m;
        proxy_read_timeout 120s;
    }

    # The applicant's data endpoints. /apply/* is the page and falls through to
    # the SPA below; these two are the API calls that page makes.
    location ~ ^/openings/[^/]+/apply$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        client_max_body_size 12m;
        proxy_read_timeout 120s;
    }

    location ~ ^/openings/[^/]+$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # The panel is not advertised and must not be indexed. This is hygiene, not
    # a security control: the sign-in is what protects it.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /panel\nDisallow: /apply\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
