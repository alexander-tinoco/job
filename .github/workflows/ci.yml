name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest

    # Tests run against real Postgres, not SQLite: native enums, JSONB and the
    # generated tsvector column do not exist in SQLite, so an in-memory database
    # would let tests pass while production fails.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: screening
          POSTGRES_PASSWORD: screening
          POSTGRES_DB: screening
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U screening"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://screening:screening@localhost:5432/screening
      # Deliberately empty. No CI job may reach the OpenAI API (CLAUDE.md AI
      # rule 12); every test uses recorded fixtures.
      OPENAI_API_KEY: ""
      WORKER_ENABLED: "false"
      COOKIE_SECURE: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        working-directory: api
        run: |
          uv venv --python 3.14
          uv pip install -e ".[dev]"

      - name: Lint
        working-directory: api
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Types
        working-directory: api
        run: .venv/bin/mypy .

      - name: Migrations apply and roll back cleanly
        working-directory: api
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic downgrade base
          .venv/bin/alembic upgrade head
          .venv/bin/alembic check

      # --cov reads the thresholds from pyproject: branch coverage with a floor,
      # so a change that adds untested code fails here rather than in review.
      - name: Tests and coverage floor
        working-directory: api
        run: .venv/bin/pytest -q --cov

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Types
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  # The four journeys where a silent break shows up in no Python test: the API
  # can be entirely correct while the panel renders nothing. Runs against the
  # real stack, brought up with compose and seeded, because a mocked back end
  # would only prove the front end agrees with the mock.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v5

      - name: Start the stack
        env:
          # Plain http in CI, where a Secure cookie would never be stored and
          # every signed-in journey would fail on its second request.
          COOKIE_SECURE: "false"
        run: docker compose up -d --build db api web

      - name: Wait for it
        run: |
          for i in $(seq 120); do
            api=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health || true)
            web=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/ || true)
            [ "$api" = "200" ] && [ "$web" = "200" ] && exit 0
            sleep 1
          done
          echo "stack did not come up"; docker compose logs --tail 80; exit 1

      - name: Seed the demo data
        working-directory: api
        run: |
          uv venv --python 3.14
          uv pip install -e ".[dev]"
          # getpass falls back to stdin without a TTY, so the two prompts are
          # fed as two lines. It warns that input may be echoed; in CI that is
          # a fixed demo password, printed in the README.
          printf 'correct-horse-battery\ncorrect-horse-battery\n' \
            | .venv/bin/python -m app.cli create-user demo@acme.com "Demo"
          .venv/bin/python scripts/seed_demo.py
          # There is no OpenAI key here, so the seed's evaluate step answers 503
          # and every candidate stays unscored — which is exactly what the panel
          # journeys need. The scores are written from the recorded golden runs
          # instead, with no call to the model.
          .venv/bin/python scripts/seed_evaluations.py

      - name: Install Playwright
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the journeys
        working-directory: web
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 200

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Built, not pushed: this proves the deploy artefacts still assemble,
      # which a lint-and-test job would not catch.
      - name: Build the API image
        run: docker build -f api/Dockerfile api/
      - name: Build the panel image
        run: docker build -f web/Dockerfile web/

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Conventional commit messages
        run: npx commitlint --from origin/main --to HEAD --verbose
        if: github.event_name == 'pull_request'
